<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>芽叶记 · 立体手绘卡片预览</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: light; font-family: "Microsoft YaHei",sans-serif; color: #334a37; background: #eeeade; }
    body { margin: 0; background: radial-gradient(ellipse at 10% 0,#e0e7cc,transparent 55%),#eeeade; }
    button,input { font: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:focus-visible,input:focus-visible { outline: 3px solid #ca8f47; outline-offset: 4px; }
    button { transition: transform .18s,background .18s; }
    button:active { transform: scale(.96); }
    main { max-width: 1080px; margin: auto; padding: 46px 30px; display: grid; grid-template-columns: 420px 1fr; gap: 90px; align-items: center; }
    .phone { position: relative; border: 7px solid #fffdf3; border-radius: 42px; padding: 22px 18px 104px; overflow: hidden; min-height: 844px; background: #f8f4e8 url('../app/src/main/res/drawable-nodpi/bg_fixed_forest.png') center/100% 100%; box-shadow: 0 22px 75px #4b4b3024; }
    .status { display: flex; justify-content: space-between; font-size: 11px; color: #554c3d; margin: 0 9px 27px; }
    header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 25px; }
    .back { border: 1px solid #b9c3a2; border-radius: 50%; background: #fffdf4; width: 36px; height: 36px; color: #4c6347; font-size: 23px; }
    .date { font-size: 11px; color: #7a8067; margin: 0 6px 6px; }
    h1 { margin: 0 6px; font-family: serif; font-size: 29px; font-weight: 500; }
    .stage { padding-top: 122px; perspective: 1000px; }
    .hero { --dark:#234d3f; --light:#749b57; --accent:#e2edaf; position: relative; isolation: isolate; min-height: 356px; border-radius: 27px 28px 24px 28px; padding: 26px 22px 20px; background: linear-gradient(115deg,var(--light) -55%,var(--dark) 80%); color: #fff8dd; box-shadow: 0 9px 0 #bfc4a3,0 21px 27px #263e2b2a; transform: rotate(-1.5deg); transition: transform .35s,background .35s; }
    .hero::before { content:""; position: absolute; inset: 7px; border: 1px solid #fff8dd44; border-radius: 21px; pointer-events: none; z-index: 4; }
    .hero::after { content:""; position: absolute; inset: 0; opacity: .13; border-radius: inherit; background: url('../app/src/main/res/drawable-nodpi/forest_paper_clean.webp') center/350px; mix-blend-mode: screen; z-index: 0; pointer-events: none; }
    .hero[data-theme="gold"] { --dark:#835430; --light:#c7a35c; --accent:#ffe5a3; }
    .hero[data-theme="blue"] { --dark:#35576a; --light:#8db0aa; --accent:#dbeebe; }
    .copy { position: relative; z-index: 3; }
    .subject { display: inline-flex; align-items: center; gap: 7px; border: 1px solid #e5edbd5c; border-radius: 18px; background: #1f332c5c; color: #f6f0d2; padding: 7px 11px; font-size: 11px; }
    .subject::before { content:""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .title { font-size: 38px; font-weight: 800; letter-spacing: -2px; line-height: 1.26; margin: 22px 0 12px; max-width: 180px; text-shadow: 1px 2px #183b2c; }
    .tiny { font-size: 11px; color: #f2f3d0bb; margin: 0; }
    .character { position: absolute; z-index: 2; width: 218px; height: 264px; object-fit: contain; top: -128px; right: -23px; transform: rotate(8deg); filter: drop-shadow(0 8px 3px #193c2c2d); transition: top .4s,transform .4s,width .4s; pointer-events: none; }
    .branch { position: absolute; right: -10px; bottom: 80px; width: 115px; height: 110px; border: 1px solid #dfe9b425; border-radius: 70% 10% 75% 20%; transform: rotate(20deg); background: #d5e89d12; z-index: 0; }
    .timer-row { position: relative; z-index: 3; margin-top: 29px; display: flex; align-items: end; justify-content: space-between; }
    .timer { font-size: 35px; font-weight: 400; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .timer small { display: block; font-size: 10px; letter-spacing: .5px; margin-bottom: 7px; color: #f0efcebb; }
    .leaf-stamp { display: grid; place-content: center; width: 65px; height: 65px; text-align: center; border-radius: 50%; border: 1px dashed #e6efb58c; background: #d8e9a613; transform: rotate(11deg); font-size: 10px; color: #e9efc8; }
    .leaf-stamp b { font-family: serif; font-size: 24px; margin-bottom: 2px; }
    .action { display: flex; align-items: center; justify-content: space-between; gap: 12px; position: relative; z-index: 3; margin-top: 22px; width: 100%; background: var(--accent); color: var(--dark); border: 1px solid #ffffff60; border-radius: 13px; padding: 15px 17px; font-size: 14px; font-weight: 700; box-shadow: 0 3px #162f292a; }
    .action .arrow { font-size: 23px; line-height: 15px; }
    .hero.flat .character { top: 46px; width: 130px; right: -4px; height: 170px; transform: rotate(0); }
    .hero.flat { transform: rotate(0); }
    .subcard { margin-top: 30px; display: flex; align-items: center; gap: 12px; border: 1px solid #bdc7ab; padding: 15px 16px; border-radius: 17px; background: #fffdf2c9; }
    .sprout { width: 40px; height: 44px; object-fit: contain; }
    .subcard strong { font-size: 13px; font-weight: 500; }
    .subcard p { margin: 6px 0 0; font-size: 10px; color: #82856e; }
    .summary { margin-top: 23px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #6f7861; padding: 0 7px; }
    .summary b { color: #36573b; font-weight: 500; }
    .navigation { position: absolute; bottom: 18px; left: 17px; right: 17px; display: flex; border: 1px solid #c4c9af; border-radius: 24px; padding: 7px; background: #fffdf4ee; box-shadow: 0 4px 12px #5d634617; }
    .navigation button { flex: 1; background: transparent; border: 0; color: #777e67; border-radius: 17px; padding: 12px 4px; font-size: 11px; }
    .navigation button.active { background: #e4ebd8; color: #36573b; }
    .controls h2 { font-family: serif; font-size: 34px; line-height: 1.3; font-weight: 500; margin: 12px 0 20px; }
    .controls p { color: #707663; font-size: 14px; line-height: 1.9; max-width: 390px; }
    .control-group { margin-top: 32px; }
    .control-group > span { display: block; font-size: 12px; margin-bottom: 13px; }
    .swatches { display: flex; gap: 13px; }
    .swatch { border: 3px solid #eeeade; outline: 1px solid #b6bea1; border-radius: 50%; width: 38px; height: 38px; background: var(--color); }
    .swatch[aria-pressed="true"] { outline: 2px solid #566c4b; transform: scale(1.1); }
    .option { display: flex; align-items: center; gap: 10px; font-size: 13px; cursor: pointer; }
    .option input { accent-color: #426842; width: 18px; height: 18px; }
    .reset { border: 1px solid #acb89c; border-radius: 11px; padding: 11px 17px; background: #fffdf1; color: #385c3e; font-size: 12px; }
    .feedback { min-height: 24px; margin-top: 16px; font-size: 12px; color: #4c6748; }
    @media(max-width:850px) { main { gap: 35px; grid-template-columns: minmax(0,420px); justify-content: center; padding: 20px 12px 50px; } .controls { padding: 0 18px; } .controls h2 { font-size: 28px; } }
    @media(max-width:420px) { .phone { border-width: 0; border-radius: 0; box-shadow: none; min-height: 805px; padding-inline: 22px; } main { padding: 0 0 30px; gap: 25px; } .character { width: 205px; right: -21px; } }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition: none !important; } }
  </style>
</head>
<body>
<main>
  <section class="phone" aria-label="学习小屋卡片预览">
    <div class="status"><span>9:41</span><span>▰ ▰ ◕</span></div>
    <header><button class="back" aria-label="查看卡片设计说明">‹</button><span>学习小屋</span><span aria-hidden="true">❧</span></header>
    <p class="date">今天，陪自己向前一点。</p>
    <h1>森林自习室</h1>
    <div class="stage">
      <article class="hero" data-theme="green">
        <img class="character" src="../app/src/main/res/drawable-nodpi/crayon_study_companion.png" alt="抱着书本，探出卡片的小伙伴">
        <div class="branch" aria-hidden="true"></div>
        <div class="copy"><span class="subject">数据结构 · 408</span><h2 class="title">学一点，<br>长一点。</h2><p class="tiny" id="status">准备好，就从这一页开始。</p></div>
        <div class="timer-row"><div class="timer"><small>本次专注</small><output id="clock" aria-label="本次专注时长">00:00:00</output></div><div class="leaf-stamp"><b>25</b>分钟目标</div></div>
        <button class="action" id="start"><span id="action-label">开始专注</span><span class="arrow" aria-hidden="true">↗</span></button>
      </article>
    </div>
    <div class="subcard"><img class="sprout" src="../app/src/main/res/drawable-nodpi/savings_seedling_stage_1.png" alt="小树苗"><div><strong>你的每一段专注，都会留下新绿。</strong><p>累计学习 25 分钟，获得 1 滴水。</p></div></div>
    <div class="summary"><span>今日学习 <b>7小时55分</b></span><span>示例数据</span></div>
    <nav class="navigation" aria-label="预览导航"><button class="active" data-note="正在查看专注卡片">⌑ 专注</button><button data-note="时长统计沿用第二版，当前预览聚焦卡片设计">▥ 学习足迹</button><button data-note="互动种树沿用第二版，当前预览聚焦卡片设计">♧ 小林地</button></nav>
  </section>
  <aside class="controls">
    <span style="font-size:12px;color:#7c846a">芽叶记 · 卡片设计预览</span>
    <h2>让学习伙伴，<br>从卡片里探出头。</h2>
    <p>角色向上越出边缘，奶油色大字压住画面重心。纸纹、手绘轮廓与厚纸底边，把森林手帐变成一张有层次的专注卡片。</p>
    <div class="control-group"><span>卡片主题</span><div class="swatches"><button class="swatch" style="--color:#315d45" data-theme="green" aria-label="森林绿" aria-pressed="true"></button><button class="swatch" style="--color:#a77843" data-theme="gold" aria-label="橡果棕" aria-pressed="false"></button><button class="swatch" style="--color:#507b8a" data-theme="blue" aria-label="湖水蓝" aria-pressed="false"></button></div></div>
    <div class="control-group"><label class="option"><input type="checkbox" id="breakout" checked>角色越出卡片边界</label></div>
    <div class="control-group"><button class="reset" id="reset">重置预览计时</button></div>
    <div class="feedback" role="status" aria-live="polite">点击「开始专注」体验按压与状态反馈。</div>
  </aside>
</main>
<script>
  const hero = document.querySelector('.hero');
  const feedback = document.querySelector('.feedback');
  const clock = document.querySelector('#clock');
  const label = document.querySelector('#action-label');
  const status = document.querySelector('#status');
  let running = false;
  let accumulated = 0;
  let started = 0;
  function elapsed() { return accumulated + (running ? performance.now() - started : 0); }
  function paintClock() {
    const seconds = Math.floor(elapsed() / 1000);
    clock.textContent = [Math.floor(seconds / 3600), Math.floor(seconds / 60) % 60, seconds % 60].map(n => String(n).padStart(2,'0')).join(':');
  }
  document.querySelector('#start').addEventListener('click', () => {
    if (running) accumulated += performance.now() - started;
    else started = performance.now();
    running = !running;
    label.textContent = running ? '暂停一下' : accumulated ? '继续专注' : '开始专注';
    status.textContent = running ? '正在专注，伙伴陪你读这一页。' : '休息一下，计时已暂停。';
    feedback.textContent = running ? '计时已开始，可随时暂停。' : '已暂停，休息时间不会计入本次专注。';
    paintClock();
  });
  document.querySelector('#reset').addEventListener('click', () => {
    running = false;
    accumulated = 0;
    label.textContent = '开始专注';
    status.textContent = '准备好，就从这一页开始。';
    feedback.textContent = '预览计时已归零。';
    paintClock();
  });
  document.querySelectorAll('.swatch').forEach(button => button.addEventListener('click', () => {
    hero.dataset.theme = button.dataset.theme;
    document.querySelectorAll('.swatch').forEach(other => other.setAttribute('aria-pressed', String(other === button)));
    feedback.textContent = '已切换为' + button.getAttribute('aria-label') + '。';
  }));
  document.querySelector('#breakout').addEventListener('change', event => {
    hero.classList.toggle('flat', !event.target.checked);
    feedback.textContent = event.target.checked ? '已展开角色，让插画越出卡片。' : '已将角色收回卡片内部，方便比较层次。';
  });
  document.querySelectorAll('.navigation button').forEach(button => button.addEventListener('click', () => feedback.textContent = button.dataset.note));
  document.querySelector('.back').addEventListener('click', () => document.querySelector('.controls').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'instant' : 'smooth'}));
  setInterval(paintClock, 250);
  document.addEventListener('visibilitychange', paintClock);
</script>
</body>
</html>
