services:
  mysql:
    image: mysql:8.4
    container_name: songguo-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pkmapp}
      MYSQL_USER: ${PKM_DB_USER:-songguo}
      MYSQL_PASSWORD: ${PKM_DB_PASSWORD:?PKM_DB_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=192M
      - --innodb-log-buffer-size=16M
      - --max-connections=60
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: songguo-server:4.0.0
    container_name: songguo-server
    restart: unless-stopped
    mem_limit: 640m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: ${JAVA_OPTS:--Xms128m -Xmx384m -XX:+UseG1GC -Duser.timezone=Asia/Shanghai}
      PKM_SERVER_PORT: 8080
      PKM_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pkmapp}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      PKM_DB_USER: ${PKM_DB_USER:-songguo}
      PKM_DB_PASSWORD: ${PKM_DB_PASSWORD:?PKM_DB_PASSWORD is required}
      PKM_JWT_SECRET: ${PKM_JWT_SECRET:?PKM_JWT_SECRET is required}
      PKM_ADMIN_TOKEN: ${PKM_ADMIN_TOKEN:?PKM_ADMIN_TOKEN is required}
    ports:
      - "${PKM_BIND_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mysql_data:
