server:
  port: ${PKM_SERVER_PORT:8080}

spring:
  application:
    name: songguo-server
  datasource:
    url: ${PKM_DB_URL:jdbc:mysql://127.0.0.1:3306/pkmapp?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${PKM_DB_USER:root}
    password: ${PKM_DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    default-property-inclusion: non_null

pkm:
  jwt:
    secret: ${PKM_JWT_SECRET:songguo-pkmapp-local-jwt-secret-key-2026-please-change-in-prod}
    access-ttl-seconds: 7200
    refresh-ttl-seconds: 2592000
  admin:
    token: ${PKM_ADMIN_TOKEN:songguo-admin-local-token}
